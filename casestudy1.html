<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Chaitanya Bharath School · Website case study</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#050505;--sf:#111;--ln:rgba(255,255,255,.1);--ac:#B8FF00;--on:#050505;--mu:#A8A8A8;--so:#b5b5b5}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}h1,h2,h3,h4,h5{font-family:'Space Grotesk',sans-serif;letter-spacing:-.02em;margin:0}
p{color:var(--so);line-height:1.7;margin:0}.w{max-width:1200px;margin:0 auto;padding:0 6vw}
.mono{font:500 .75rem 'JetBrains Mono',monospace;letter-spacing:.22em;text-transform:uppercase}.lb{color:var(--ac);margin-bottom:1.1rem}
h2{font-size:clamp(1.8rem,4.2vw,3rem);line-height:1.08;font-weight:600;max-width:20ch}
section{padding:clamp(56px,10vh,104px) 0;border-top:1px solid var(--ln)}.in2{margin-top:1.2rem;max-width:42rem}
.rv{opacity:0;transform:translateY(22px);transition:.7s}.rv.in{opacity:1;transform:none}
@media(prefers-reduced-motion:reduce){.rv{opacity:1;transform:none}.mq div{animation:none!important}}
/* bar */
.bar{position:fixed;inset:0 0 auto;z-index:50;padding:calc(.8rem + env(safe-area-inset-top,0px)) 6vw .6rem;background:rgba(5,5,5,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.bar .row{display:flex;justify-content:space-between;margin-bottom:.5rem}.bar .row a{font:600 .75rem 'Space Grotesk';letter-spacing:.18em;text-transform:uppercase;color:var(--so)}
.pct{font:500 .75rem 'JetBrains Mono';color:var(--ac)}.prog{position:absolute;left:0;bottom:0;height:2px;background:var(--ac);width:0}
.tabs{display:flex;gap:.4rem;overflow-x:auto;scrollbar-width:none}.tabs::-webkit-scrollbar{display:none}
.tabs a{flex:none;padding:.42rem .9rem;border:1px solid var(--ln);border-radius:99px;font:600 .75rem 'Space Grotesk';letter-spacing:.12em;text-transform:uppercase;color:var(--so)}
.tabs a.on{background:var(--ac);color:var(--on);border-color:var(--ac)}
/* hero */
.hero{padding:9.5rem 0 4rem;position:relative;overflow:hidden}.hero:before{content:"";position:absolute;top:-20%;right:-15%;width:60vw;height:60vw;background:radial-gradient(closest-side,rgba(184,255,0,.16),transparent);filter:blur(30px);z-index:-1}
.hg{display:grid;grid-template-columns:1.05fr 1fr;gap:3rem;align-items:center}
h1{font-size:clamp(2.3rem,6vw,4.6rem);line-height:1;font-weight:700;text-transform:uppercase}
.meta{display:grid;grid-template-columns:repeat(2,1fr);gap:1.2rem;margin-top:2.2rem;padding-top:1.4rem;border-top:1px solid var(--ln)}
.meta h4{font:400 .75rem 'JetBrains Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-bottom:.3rem}.meta span{font-size:.92rem}
.mq{overflow:hidden;margin-top:3.2rem;border-block:1px solid var(--ln);padding:.85rem 0;color:var(--so);-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.mq div{display:flex;gap:2.4rem;width:max-content;animation:m 28s linear infinite}.mq span:after{content:"✦";margin-left:2.4rem;color:var(--ac)}@keyframes m{to{transform:translateX(-50%)}}
@media(max-width:860px){.hg{grid-template-columns:1fr}}
/* kpi + results */
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:20px;overflow:hidden;margin-top:2.4rem}
.kp div{background:var(--bg);padding:1.8rem 1.5rem}.kp b{display:block;font:600 clamp(2rem,4.2vw,3rem) 'Space Grotesk';color:var(--ac);letter-spacing:-.03em}.kp span{color:var(--so);font-size:.88rem}
/* overview */
.ov{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--ln);border:1px solid var(--ln);border-radius:20px;overflow:hidden}
.ov div{background:var(--bg);padding:2rem}.ov h3{font-size:1.25rem;margin:.7rem 0}@media(max-width:800px){.ov{grid-template-columns:1fr}}
/* cards */
.cd{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;margin-top:2.4rem}
.c{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:1.5rem;transition:.25s}.c:hover{border-color:rgba(184,255,0,.5);transform:translateY(-3px)}
.c .n{color:var(--ac);font:500 .75rem 'JetBrains Mono'}.c h3{font-size:1.08rem;margin:.7rem 0 .4rem}.c p{font-size:.9rem;line-height:1.6}
.ch{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:1.6rem}.ch span{padding:.4rem .9rem;border:1px solid var(--ln);border-radius:99px;color:var(--so)}
/* steps */
.st{display:grid;gap:clamp(2.5rem,6vw,5rem);margin-top:3rem}.s{display:grid;grid-template-columns:1fr 1.2fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}
.s:nth-child(even) .t{order:2}.s .n{color:var(--ac);font:500 .8rem 'JetBrains Mono';margin-bottom:.8rem}.s h3{font-size:clamp(1.3rem,2.6vw,2rem);margin-bottom:.8rem}
@media(max-width:760px){.s{grid-template-columns:1fr}.s:nth-child(even) .t{order:0}}
/* flow / chat layout */
.fl{display:flex;flex-wrap:wrap;margin-top:2.4rem}.nd{flex:1 1 190px;background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:1.3rem;position:relative;margin:0 1.6rem 1.4rem 0}
.nd:not(:last-child):after{content:"→";position:absolute;right:-1.5rem;top:50%;translate:0 -50%;color:var(--ac)}.nd h3{font-size:1.02rem;margin:.5rem 0 .3rem}.nd p{font-size:.86rem}
@media(max-width:700px){.nd{margin-right:0}.nd:not(:last-child):after{content:"↓";right:auto;left:50%;top:auto;bottom:-1.5rem;translate:-50% 0}}
.sp{display:grid;grid-template-columns:1fr 1fr;gap:clamp(1.5rem,4vw,4rem);align-items:center}@media(max-width:800px){.sp{grid-template-columns:1fr}}
/* compare */
.th{display:grid;grid-template-columns:1fr 1fr;gap:2rem;margin-bottom:2rem}.th h3{font-size:clamp(1.1rem,2.2vw,1.6rem)}.th p{margin-top:.5rem;font-size:.95rem}@media(max-width:700px){.th{grid-template-columns:1fr}}
.cmp{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--ln);--p:50%;aspect-ratio:16/9;container-type:inline-size;background:#0b0b0b}.cmp>.v{position:absolute;inset:0;border:0}.cmp .bw{height:100%;border-radius:0;border:0}
.cmp .b{clip-path:inset(0 calc(100% - var(--p)) 0 0)}.cmp .tg{position:absolute;top:1rem;z-index:3;background:rgba(0,0,0,.7);padding:.3rem .8rem;border-radius:99px}.tl{left:1rem}.tr{right:1rem}
.cmp .kn{position:absolute;top:0;bottom:0;left:var(--p);width:2px;background:var(--ac);z-index:3;pointer-events:none}.cmp .kn:after{content:"⇆";position:absolute;top:50%;left:50%;translate:-50% -50%;width:2.6rem;height:2.6rem;border-radius:50%;background:var(--ac);color:var(--on);display:grid;place-items:center}
.cmp input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:ew-resize;z-index:4;margin:0}
/* foundation */
.fd{display:grid;gap:1rem;margin-top:2.2rem;grid-template-columns:repeat(auto-fit,minmax(230px,1fr))}.sw{border-radius:18px;padding:1.3rem;min-height:160px;display:flex;flex-direction:column;justify-content:flex-end;border:1px solid var(--ln)}.sw small{font:500 .75rem 'JetBrains Mono';letter-spacing:.1em;text-transform:uppercase;opacity:.75;margin-top:.3rem}
.ty{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:1.3rem}.ty .aa{font-size:3rem;line-height:1;margin-bottom:.6rem}.ty p{font-size:.86rem}
.stk{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:2rem}.stk span{padding:.55rem 1rem;border-radius:12px;background:var(--sf);border:1px solid var(--ln);font-size:.88rem}
.b1,.b2{display:inline-block;padding:.65rem 1.2rem;border-radius:99px;font-size:.85rem;font-weight:500;margin:1.2rem .6rem 0 0}.b1{background:var(--ac);color:var(--on)}.b2{border:1px solid var(--ln)}
/* showcase */
.sh{display:grid;grid-template-columns:repeat(12,1fr);gap:1.4rem;margin-top:2.6rem;align-items:end}.fr{grid-column:span 12;margin:0}.fr.tablet{grid-column:span 5}.fr.mobile{grid-column:span 3}.fr.half{grid-column:span 6}.fr.desktop{grid-column:span 12}.fr.square{grid-column:span 4}
.fr h3{font-size:1.02rem;margin-top:.9rem}.fr p{font-size:.86rem}@media(max-width:800px){.fr.tablet,.fr.mobile,.fr.square{grid-column:span 6}.fr.half{grid-column:span 12}}
blockquote{margin:3rem 0 0;max-width:46rem}blockquote p{font:500 clamp(1.3rem,2.8vw,2rem)/1.3 'Space Grotesk';color:#fff}blockquote cite{display:block;margin-top:1.2rem;font-style:normal;color:var(--mu);font-size:.9rem}
/* cta */
.cta{text-align:center}.cta h2{margin:0 auto 2rem;max-width:16ch}.btn{display:inline-block;background:var(--ac);color:var(--on);font:700 .75rem 'Space Grotesk';letter-spacing:.16em;text-transform:uppercase;padding:1rem 1.8rem;border-radius:99px;margin:.3rem}.btn.g{background:none;color:#fff;border:1px solid var(--ln)}
.nx{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:1.5rem;border:1px solid var(--ln);border-radius:18px;margin-top:3rem;text-align:left}.nx:hover{border-color:var(--ac)}.nx h3{font-size:1.2rem;margin-top:.3rem}
footer{padding:2rem 0;border-top:1px solid var(--ln);color:var(--mu);font-size:.8rem}footer .w{display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem}
/* ===== hero A: centered stage ===== */
.hero{padding:8.5rem 0 3rem;text-align:center}.hero:before{top:-35%;left:50%;right:auto;translate:-50% 0;width:90vw;height:70vw;background:radial-gradient(closest-side,rgba(184,255,0,.12),transparent)}
.hero:after{content:"";position:absolute;inset:0;z-index:-1;background-image:radial-gradient(rgba(255,255,255,.08) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(#000,transparent 70%);mask-image:linear-gradient(#000,transparent 70%)}
.hc{max-width:54rem;margin:0 auto}
.pr{display:flex;justify-content:center;flex-wrap:wrap;gap:.6rem;margin-bottom:1.5rem}.pr span{padding:.42rem .95rem;border-radius:99px;border:1px solid var(--ln);color:var(--so)}.pr span:first-child{border-color:rgba(184,255,0,.45);color:var(--ac);background:rgba(184,255,0,.07)}
h1{font-size:clamp(2.3rem,5.6vw,4.6rem);text-transform:none;line-height:1.03;letter-spacing:-.04em;max-width:18ch;margin:0 auto}
.hero .in2{font-size:1.1rem;margin:1.3rem auto 0;max-width:38rem}.c2{display:flex;justify-content:center;flex-wrap:wrap;gap:.4rem;margin-top:1.8rem}.c2 .btn{margin:0}
.stage2{position:relative;max-width:980px;margin:3.4rem auto 0}.stage2:before{content:"";position:absolute;inset:10% 6%;background:radial-gradient(closest-side,rgba(184,255,0,.22),transparent);filter:blur(45px);z-index:0}
.stage2 .sm{position:relative;z-index:2;text-align:left}.stage2 .bw{aspect-ratio:2/1;box-shadow:0 40px 100px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.07)}
.stage2.ph .sm{max-width:280px;margin:0 auto}.stage2.ph .pf{aspect-ratio:9/15}.stage2.ph .pf{box-shadow:0 40px 100px rgba(0,0,0,.7),0 0 0 1px rgba(255,255,255,.08)}
.sl,.sr{position:absolute;width:45%;z-index:1;text-align:left;opacity:.92}.sl{left:0;top:12%}.sr{right:0;top:34%}.sl .bw,.sr .bw{aspect-ratio:16/10}
.fc{position:absolute;z-index:4;text-align:left;background:rgba(20,20,20,.84);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:.85rem 1.2rem;box-shadow:0 20px 50px rgba(0,0,0,.55);animation:fl 6s ease-in-out infinite}
.fc b{display:block;font:600 1.7rem 'Space Grotesk';color:var(--ac);letter-spacing:-.03em;line-height:1.1}.fc span{font-size:.78rem;color:var(--so)}.fc.a{left:-2.5%;top:10%}.fc.b{right:-2.5%;bottom:8%;animation-delay:-3s}
@keyframes fl{50%{transform:translateY(-8px)}}@media(prefers-reduced-motion:reduce){.fc{animation:none}}
.meta4{display:grid;grid-template-columns:repeat(4,1fr);margin:3.2rem auto 0;max-width:980px;border-top:1px solid var(--ln);text-align:left}
.meta4 div{padding:1.3rem 1.2rem;border-left:1px solid var(--ln)}.meta4 div:first-child{border-left:0;padding-left:0}.meta4 h4{font:400 .75rem 'JetBrains Mono';letter-spacing:.18em;text-transform:uppercase;color:var(--mu);margin-bottom:.4rem}.meta4 span{font-size:.95rem}
@media(max-width:760px){.sl,.sr{display:none}.fc{padding:.6rem .9rem}.fc b{font-size:1.2rem}.fc.a{left:0}.fc.b{right:0}.meta4{grid-template-columns:1fr 1fr}.meta4 div:nth-child(3){border-left:0;padding-left:0}.stage2 .bw{aspect-ratio:4/3}}

/* ===== site-section mocks ===== */
.fr.tb2,.fr.mb2{align-self:center}.fr.tb2 .bw{font-size:max(11px,1.75cqw)}.fr.dv{grid-column:span 12}.fr.tb2{grid-column:span 7}.fr.mb2{grid-column:span 5}.fr.mb2 .pf{max-width:250px;margin-inline:auto;aspect-ratio:auto;font-size:max(11px,4.2cqw)}@media(max-width:800px){.fr.tb2,.fr.mb2{grid-column:span 12}}

.s .pf{aspect-ratio:auto;max-width:300px;margin-inline:auto;font-size:max(12px,4.2cqw)}
.k{background:#161616;border:1px solid var(--ln);border-radius:.8em;padding:.9em}.k b{display:block;font-size:1em;margin-bottom:.3em}.k span,.k p{color:var(--so);font-size:.85em;line-height:1.45}.k ul{margin:.4em 0 0;padding-left:1.1em;color:var(--so);font-size:.85em;line-height:1.6}
.lab{color:var(--ac);font:500 .75em 'JetBrains Mono';letter-spacing:.18em;text-transform:uppercase}.hd{font:600 1.7em/1.1 'Space Grotesk';letter-spacing:-.02em}
.cg{display:grid;gap:.8em}.c2g{grid-template-columns:1fr 1fr}.c3g{grid-template-columns:repeat(3,1fr)}.c4g{grid-template-columns:repeat(4,1fr)}.cl2{grid-template-columns:1fr 1.5fr;align-items:center}
.ip{border-radius:.8em;background:linear-gradient(135deg,rgba(184,255,0,.28),#161616 70%);min-height:6em;display:flex;align-items:flex-end;padding:.7em;font-size:.85em;color:var(--so)}
.nv{display:flex;align-items:center;gap:1.1em;font-size:.85em;color:var(--so);border-bottom:1px solid var(--ln);padding-bottom:.7em}.nv b{color:#fff;font:700 1.1em 'Space Grotesk'}.nv em{margin-left:auto;font-style:normal;background:var(--ac);color:var(--on);padding:.35em .9em;border-radius:99px;font-weight:600}
.chp{display:inline-block;padding:.25em .75em;border:1px solid var(--ln);border-radius:99px;font-size:.8em;color:var(--so);margin:.2em .2em 0 0}
.bt2{display:inline-block;padding:.5em 1.1em;border-radius:99px;font-weight:600;font-size:.9em;margin:.3em .4em 0 0}.bt2.p{background:var(--ac);color:var(--on)}.bt2.o{border:1px solid var(--ln);color:#fff}
.stt{display:grid;grid-template-columns:repeat(4,1fr);gap:.8em;text-align:center}.stt b{display:block;font:600 1.8em 'Space Grotesk';color:var(--ac)}.stt span{color:var(--so);font-size:.8em}
@media(max-width:700px){.c3g,.c4g,.c2g,.cl2{grid-template-columns:1fr 1fr}.cl2{grid-template-columns:1fr}}
/* ===== built-in mock visuals (no images needed) ===== */
.v{container-type:inline-size;width:100%}
.bw{border:1px solid var(--ln);border-radius:14px;overflow:hidden;background:#0d0d0d;font-size:max(8px,1.75cqw);display:flex;flex-direction:column;aspect-ratio:16/9;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.tablet .bw{aspect-ratio:4/3}.bt{display:flex;align-items:center;gap:.5em;padding:.7em 1em;background:#171717;border-bottom:1px solid var(--ln)}
.bt i{width:.8em;height:.8em;border-radius:50%;background:#333}.bt em{margin-left:1em;flex:1;font-style:normal;background:#0d0d0d;border-radius:99px;padding:.3em 1em;color:var(--mu);font-size:.9em}
.bb{flex:1;padding:1.6em;display:flex;flex-direction:column;gap:1em;overflow:hidden;min-height:0}
.pf{border:5px solid #1d1d1d;border-radius:2.2em;background:#0b0b0b;aspect-ratio:9/18.5;font-size:4.2cqw;padding:1.1em;display:flex;flex-direction:column;gap:.6em;overflow:hidden;position:relative;box-shadow:0 30px 80px rgba(0,0,0,.5)}
.pf:before{content:"";align-self:center;width:30%;height:.5em;background:#1d1d1d;border-radius:9px;flex:none}
.mh{padding:1.6em;border-radius:1em;background:linear-gradient(135deg,rgba(184,255,0,.18),#141414);display:flex;flex-direction:column;gap:.6em;align-items:flex-start}.mh small{color:var(--ac);letter-spacing:.2em;font-size:.8em}.mh b{font:600 2.1em/1.05 'Space Grotesk';max-width:14ch}.mh p{font-size:1em;line-height:1.4;max-width:30ch}
.mb{background:var(--ac);color:var(--on);padding:.5em 1.1em;border-radius:99px;font-weight:600}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}.g3 div{background:#161616;border:1px solid var(--ln);border-radius:.8em;padding:.8em;display:flex;flex-direction:column;gap:.5em}.g3 s{height:3.2em;border-radius:.5em;background:linear-gradient(135deg,#2a2a2a,#171717)}.g3 b{font-size:.95em}.g3 span{color:var(--mu);font-size:.85em}
.ol{background:#e9e9e4;color:#333;border-radius:.6em;padding:1em;display:flex;flex-direction:column;gap:.5em;flex:1}.ol u{color:#1a4fb4;font-size:1em}.ol i{display:block;height:.6em;background:#bdbdb5;border-radius:3px}.ol .bl{color:#1a4fb4;font-size:.9em;text-decoration:underline}
.fi{background:#161616;border:1px solid var(--ln);border-radius:.6em;padding:.7em .9em;color:var(--mu);font-size:.95em}.fi.f{border-color:var(--ac);color:#fff}.fb{background:var(--ac);color:var(--on);text-align:center;border-radius:99px;padding:.7em;font-weight:700}
.tb{width:100%;border-collapse:collapse;font-size:.95em}.tb th{text-align:left;color:var(--mu);font-weight:400;padding:.5em;border-bottom:1px solid var(--ln);font-size:.85em;letter-spacing:.1em;text-transform:uppercase}.tb td{padding:.55em .5em;border-bottom:1px solid #1c1c1c}.pl{background:rgba(184,255,0,.15);color:var(--ac);padding:.15em .7em;border-radius:99px;font-size:.9em}.pl.r{background:rgba(255,90,90,.15);color:#ff7a7a}
.kr{display:grid;grid-template-columns:repeat(3,1fr);gap:.8em}.kr div{background:#161616;border:1px solid var(--ln);border-radius:.8em;padding:.8em}.kr small{color:var(--mu);font-size:.85em}.kr b{display:block;font:600 1.8em 'Space Grotesk';color:var(--ac)}
.br{display:flex;align-items:flex-end;gap:.5em;flex:1;min-height:5em;background:#121212;border-radius:.8em;padding:.8em}.br i{flex:1;background:linear-gradient(var(--ac),rgba(184,255,0,.2));border-radius:.3em .3em 0 0}
.fu{display:flex;flex-direction:column;gap:.5em}.fu div{background:linear-gradient(90deg,var(--ac),rgba(184,255,0,.3));color:var(--on);padding:.6em 1em;border-radius:.5em;font-weight:600;font-size:.95em;display:flex;justify-content:space-between}
.fw{display:flex;align-items:center;gap:.8em;flex:1}.fw div{flex:1;background:#161616;border:1px solid var(--ln);border-radius:.8em;padding:1em;position:relative}.fw small{color:var(--ac);font-size:.75em;letter-spacing:.15em}.fw b{display:block;margin:.3em 0;font-size:1em}.fw span{color:var(--mu);font-size:.85em}.fw em{color:var(--ac);font-style:normal}
