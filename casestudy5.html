      (function f(now){var p=Math.min(1,(now-st)/dur),e=1-Math.pow(1-p,3);b.textContent=Math.round(n*e)+m[2];if(p<1)requestAnimationFrame(f)})(st)})});
  /* 4. before/after slider: one gentle demo sweep so people notice it is interactive */
  var cmp=D.getElementById('cmp'),inp=cmp&&cmp.querySelector('input[type=range]');
  if(inp){var stop=false;['pointerdown','keydown','touchstart'].forEach(function(ev){cmp.addEventListener(ev,function(){stop=true},{passive:true})});
    once(cmp,.5,function(){setTimeout(function(){var st=performance.now(),dur=2800;
      function ease(t){return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2}
      (function f(now){if(stop)return;var p=Math.min(1,(now-st)/dur),v;
        if(p<.35)v=50-40*ease(p/.35);else if(p<.8)v=10+80*ease((p-.35)/.45);else v=90-40*ease((p-.8)/.2);
        inp.value=Math.round(v);inp.dispatchEvent(new Event('input',{bubbles:true}));if(p<1)requestAnimationFrame(f)})(st)},started?200:1800)})}
  /* 5. workflow: nodes light up in sequence while the section is on screen */
  var fl=app.querySelector('.fl');
  if(fl){var nd=[].slice.call(fl.querySelectorAll('.nd')),k=0,iv=0;
    function tick(){nd.forEach(function(n,i){n.classList.toggle('m4-lit',i===k)});k=(k+1)%nd.length}
    new IntersectionObserver(function(es){if(es[0].isIntersecting){if(!iv){setTimeout(tick,1400);iv=setInterval(tick,1300)}}else{clearInterval(iv);iv=0;nd.forEach(function(n){n.classList.remove('m4-lit')})}},{threshold:.35}).observe(fl)}
}
if(D.readyState==='complete')setTimeout(init,120);else addEventListener('load',function(){setTimeout(init,120)});
})();
</script>
