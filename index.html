<style>html,body{margin:0;background:#050505;color:#fff;font-family:Inter,-apple-system,"Helvetica Neue",Arial,sans-serif}
/* one shared left edge for section text + breathing room before "Why Anotherwise" */
html{--L:max(6vw,calc(50vw - 600px))}
html,body{overflow-x:clip}
#why{margin-top:clamp(32px,6vh,72px)}
#start .font-sans{font-family:Inter,system-ui,sans-serif}
#start h2{font-family:'Space Grotesk',system-ui,sans-serif!important;font-weight:600!important;letter-spacing:-.03em!important}

/* ===== site nav (fixed, document level) ===== */
html{scroll-behavior:smooth;scroll-padding-top:5.5rem}
@media(prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
html.aw-lock,html.aw-lock body{overflow:hidden}
.aw-nav{position:fixed;top:0;left:0;right:0;z-index:1000;padding:calc(1.25rem + env(safe-area-inset-top,0px)) 1rem 0;pointer-events:none;font-family:'Space Grotesk',system-ui,sans-serif}
.aw-pill{pointer-events:auto;max-width:44rem;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.2rem .2rem .2rem 1.1rem;border-radius:999px;background:rgba(10,10,10,.58);-webkit-backdrop-filter:blur(26px) saturate(180%);backdrop-filter:blur(26px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.3),inset 0 0 0 1px rgba(255,255,255,.12),0 12px 32px -10px rgba(0,0,0,.55)}
.aw-logo{font-weight:500;font-size:.9375rem;letter-spacing:.02em;color:#fff;text-decoration:none}
.aw-links{display:flex;align-items:center;gap:2rem}
.aw-links a{font-weight:400;font-size:.875rem;letter-spacing:0;color:#c4c4c4;text-decoration:none;transition:color .2s}
.aw-links a:hover,.aw-links a.is-active{color:#B8FF00}
.aw-cta{display:flex;align-items:center;gap:.65rem;background:#B8FF00;color:#050505;font-weight:500;font-size:.8125rem;letter-spacing:0;text-decoration:none;border-radius:999px;padding:.2rem .2rem .2rem 1rem;transition:filter .2s}
.aw-cta:hover{filter:brightness(1.08)}
.aw-cta .ar{width:1.75rem;height:1.75rem;border-radius:50%;background:#050505;display:grid;place-items:center;transition:transform .2s}
.aw-cta:hover .ar{transform:translateX(2px)}
.aw-cta svg{width:.8rem;height:.8rem;stroke:#fff;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.aw-end{display:none;align-items:center;gap:.4rem}
.aw-go{width:2.25rem;height:2.25rem;border-radius:50%;background:#B8FF00;display:grid;place-items:center;text-decoration:none;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .2s,filter .2s}
.aw-go:hover{filter:brightness(1.08)}
.aw-go svg{width:.9rem;height:.9rem;stroke:#050505;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
html.aw-lock .aw-go{opacity:0;transform:scale(.6);pointer-events:none}
.aw-burger{display:none;width:2.25rem;height:2.25rem;border-radius:50%;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.07);cursor:pointer;position:relative;padding:0;transition:background .25s,border-color .25s}
.aw-burger i{position:absolute;left:50%;top:50%;width:14px;height:1.5px;margin:-.75px 0 0 -7px;background:#fff;border-radius:2px;transition:transform .3s cubic-bezier(.16,1,.3,1),background .25s}
.aw-burger i:nth-child(1){transform:translateY(-3.5px)}
.aw-burger i:nth-child(2){transform:translateY(3.5px)}
.aw-burger[aria-expanded="true"]{background:#B8FF00;border-color:#B8FF00}
.aw-burger[aria-expanded="true"] i{background:#050505}
.aw-burger[aria-expanded="true"] i:nth-child(1){transform:rotate(45deg)}
.aw-burger[aria-expanded="true"] i:nth-child(2){transform:rotate(-45deg)}
.aw-burger:focus-visible,.aw-go:focus-visible,.aw-nav a:focus-visible,.aw-menu a:focus-visible{outline:2px solid #B8FF00;outline-offset:3px}
.aw-menu{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;box-sizing:border-box;height:100vh;height:100dvh;padding:calc(4.75rem + env(safe-area-inset-top,0px)) 1.5rem calc(1.5rem + env(safe-area-inset-bottom,0px));background:radial-gradient(70% 45% at 0% 0%,rgba(184,255,0,.16),transparent 70%),#050505;color:#fff;font-family:'Space Grotesk',system-ui,sans-serif;opacity:0;visibility:hidden;transition:opacity .3s ease,visibility 0s linear .3s;overflow-y:auto}
.aw-menu.is-open{opacity:1;visibility:visible;transition:opacity .3s ease,visibility 0s}
.aw-menu ul{list-style:none;margin:1.5rem 0 0;padding:0}
.aw-menu li{border-bottom:1px solid #222;opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .5s cubic-bezier(.16,1,.3,1);transition-delay:0s}
.aw-menu.is-open li{opacity:1;transform:none;transition-delay:calc(.08s + var(--i)*.07s)}
.aw-menu li a{display:flex;justify-content:space-between;align-items:baseline;padding:.9rem .25rem;color:#fff;text-decoration:none;font-weight:400;font-size:clamp(1.75rem,8vw,2.25rem);letter-spacing:-.015em;line-height:1.1;transition:color .2s}
.aw-menu li a:hover,.aw-menu li a.is-active{color:#B8FF00}
.aw-menu li a span{font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;letter-spacing:.04em;font-weight:400;color:#A8A8A8}
.aw-menu .aw-foot{margin-top:auto;padding-top:2rem;opacity:0;transform:translateY(14px);transition:opacity .45s ease,transform .5s cubic-bezier(.16,1,.3,1)}
.aw-menu.is-open .aw-foot{opacity:1;transform:none;transition-delay:.35s}
.aw-menu .aw-cta{justify-content:space-between;width:100%;box-sizing:border-box;padding-left:1.25rem;font-size:.875rem}
.aw-menu .aw-tag{margin:1rem 0 0;text-align:center;font-family:'JetBrains Mono',ui-monospace,monospace;font-size:.75rem;letter-spacing:.04em;color:#A8A8A8}
@media(max-width:720px){.aw-links,.aw-pill>.aw-cta{display:none}.aw-end{display:flex}.aw-burger{display:block}.aw-pill{padding:.2rem .2rem .2rem 1rem}}
@media(min-width:721px){.aw-menu{display:none}.aw-nav{padding-top:calc(2.75rem + env(safe-area-inset-top,0px))}}
@media(prefers-reduced-motion:reduce){.aw-menu,.aw-menu li,.aw-menu .aw-foot,.aw-burger i{transition-duration:.01s!important;transition-delay:0s!important}}
.aw-logo{display:inline-flex;align-items:center;gap:.6rem}
.aw-logo svg{width:2.1rem;height:2.1rem;flex:none;display:block}
.aw-logo span{color:#B8FF00}
.aw-links a,.aw-cta,.aw-logo{white-space:nowrap}
.aw-pill{width:max-content;min-width:min(44rem,calc(100vw - 2rem));max-width:calc(100vw - 2rem);padding-left:.2rem}
@media(max-width:720px){.aw-pill{padding-left:.2rem}}

<script id="m3-js">
(function(){'use strict';
var D=document,RM=matchMedia('(prefers-reduced-motion:reduce)').matches,FINE=matchMedia('(hover:hover) and (pointer:fine)').matches;

var SHADOW_CSS='.m3-sw{position:absolute;inset:0;pointer-events:none;border-radius:inherit;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.55) 50%,transparent 62%);transform:translateX(-130%);animation:m3-sw 4.8s ease-in-out 3.2s infinite}'
+'@keyframes m3-sw{0%,70%{transform:translateX(-130%)}100%{transform:translateX(130%)}}'
+'.m3-sp{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .35s;z-index:0;background:radial-gradient(340px circle at var(--mx,50%) var(--my,50%),rgba(184,255,0,.13),transparent 62%)}'
+'.m3-has:hover>.m3-sp{opacity:1}'
+'.m3-shim{background:linear-gradient(100deg,#fff 42%,#B8FF00 50%,#fff 58%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent;animation:m3-sh 5.5s ease-in-out 3s infinite}'
+'@keyframes m3-sh{0%,60%{background-position:100% 0}100%{background-position:-60% 0}}'
+'.btn.primary,.aw-cta{position:relative;overflow:hidden}'
+'.m3-rv{opacity:0;translate:0 26px;transition:opacity 1.1s cubic-bezier(.16,1,.3,1),translate 1.2s cubic-bezier(.16,1,.3,1);transition-delay:var(--m3d,0ms)}'
+'.m3-rv.m3-in{opacity:1;translate:0 0}'
+'.wy.m3 li span{background:linear-gradient(90deg,#fff 0,#fff 46%,#4a4a4a 54%,#4a4a4a 100%) 100% 0/220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}'
+'.wy.m3 li i{color:var(--mu)}.wy.m3 li.m3on i{color:var(--ac)}';
function hosts(){var o=[];D.querySelectorAll('div[id]').forEach(function(h){if(h.shadowRoot)o.push(h)});return o}
function roots(){return[D].concat(hosts().map(function(h){return h.shadowRoot}))}
function deep(s){var o=[];roots().forEach(function(r){r.querySelectorAll(s).forEach(function(e){o.push(e)})});return o}
function init(){
  /* shared CSS in every shadow root + document */
  roots().forEach(function(r){var s=D.createElement('style');s.textContent=SHADOW_CSS;(r===D?D.head:r).appendChild(s)});

  /* 1. light sweep across primary CTAs */
  deep('.btn.primary,.aw-cta').forEach(function(b){var i=D.createElement('i');i.className='m3-sw';i.setAttribute('aria-hidden','true');b.appendChild(i)});

  /* 2. gradient shimmer on the last word of the hero headline (after the word split exists) */
  var tries=0,iv=setInterval(function(){tries++;
    var w=deep('#home h1 .mo-wi');
    if(w.length){clearInterval(iv);w[w.length-1].classList.add('m3-shim')}
    else if(tries>30)clearInterval(iv)},300);

  /* 3. mono labels decode (scramble) as they scroll into view */
  var G='!<>-_\\/[]{}=+*^?#01';
  function scramble(el){var t=el.textContent,n=t.length,st=performance.now(),dur=Math.min(1000,450+n*20),last=t;
    function put(v){last=v;el.textContent=v}
    function done(){if(el.textContent===last)el.textContent=t}
    setTimeout(done,dur+150);
    (function f(now){if(el.textContent!==last)return;
      var p=Math.min(1,(now-st)/dur),k=Math.floor(p*n),o='';
      for(var i=0;i<n;i++){var c=t[i];o+=(i<k||c===' ')?c:G[(Math.random()*G.length)|0]}
      put(o);if(p<1)requestAnimationFrame(f);else put(t)})(st)}
  if('IntersectionObserver' in window){
    var sio=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;sio.unobserve(e.target);
      setTimeout(function(){scramble(e.target)},Math.max(0,2300-performance.now()))})},{threshold:.6});
    deep('.label,.eyebrow,.mono').forEach(function(el){
      var t=el.textContent.trim();
      var rt=el.getRootNode(),hh=rt&&rt.host;
      if(!hh||['partners','approach','work'].indexOf(hh.id)<0)return;
      if(el.childElementCount||t.length<3||t.length>48||!/mono/i.test(getComputedStyle(el).fontFamily))return;
      sio.observe(el)});

    /* 4. lime hairlines that draw between sections */
    var rio=new IntersectionObserver(function(es){es.forEach(function(e){if(e.isIntersecting){e.target.classList.add('in');rio.unobserve(e.target)}})},{threshold:1});
    hosts().forEach(function(h){if(h.id==='home'||h.id==='approach')return;var r=D.createElement('div');r.className='m3-rule';r.setAttribute('aria-hidden','true');r.innerHTML='<i></i>';h.parentNode.insertBefore(r,h);rio.observe(r)});
  }

  /* 5a. Why Anotherwise: continuous, scroll-scrubbed white fill (replaces the threshold-based on/off colour flip) */
  (function(){var h=D.getElementById('why'),ol=h&&h.shadowRoot&&h.shadowRoot.getElementById('wy');if(!ol)return;
    ol.classList.add('m3');var li=[].slice.call(ol.children),last=[],tick=false;
    function upd(){tick=false;var vh=innerHeight;
      li.forEach(function(el,i){var r=el.getBoundingClientRect(),p=Math.min(1,Math.max(0,(vh*.86-r.top)/(vh*.34))),q=Math.round(p*200)/200;
        if(last[i]===q)return;last[i]=q;
        el.firstElementChild.style.backgroundPosition=(100-q*100)+'% 0';
        el.classList.toggle('m3on',q>.5)})}
    function req(){if(!tick){tick=true;requestAnimationFrame(upd)}}
    addEventListener('scroll',req,{passive:true});addEventListener('resize',req);upd()})();

  /* 5. minimal scroll reveals: soft fade + 26px rise, staggered, once; classes removed afterwards so original hover styles return */
  if('IntersectionObserver' in window){
    var MAP={services:'.top p',work:'.intro p,.sub',partners:'.head p,.items>*,.models>*,.types>*,.band,.note,.cta,.hint',approach:'.head p'};
    var rvio=new IntersectionObserver(function(es){es.forEach(function(e){if(!e.isIntersecting)return;rvio.unobserve(e.target);var el=e.target;
      setTimeout(function(){el.classList.add('m3-in');
        setTimeout(function(){el.classList.remove('m3-rv','m3-in');el.style.removeProperty('--m3d')},1800+(parseInt(el.style.getPropertyValue('--m3d'))||0))},Math.max(0,2300-performance.now()))})},{threshold:.15,rootMargin:'0px 0px -6% 0px'});
    hosts().forEach(function(h){var sel=MAP[h.id];if(!sel)return;var seen=new Map();
      h.shadowRoot.querySelectorAll(sel).forEach(function(el){
        if(el.closest('.rv,.m2-rise,.m3-rv'))return;
        var p=el.parentNode,i=seen.get(p)||0;seen.set(p,i+1);
        el.style.setProperty('--m3d',Math.min(i,5)*90+'ms');el.classList.add('m3-rv');rvio.observe(el)})});
  }

  if(!FINE)return;

  /* 5b. pointer spotlight on cards */
  var cards=deep('.card').filter(function(c){var h=c.getRootNode().host;return h&&h.id==='approach'});
  cards.forEach(function(c){var sp=D.createElement('div');sp.className='m3-sp';sp.setAttribute('aria-hidden','true');
    if(getComputedStyle(c).position==='static')c.style.position='relative';
    c.classList.add('m3-has');c.insertBefore(sp,c.firstChild)});

  /* 6. cursor label ("View") over case-study cards */
  var cl=D.createElement('div');cl.className='m3-cl';cl.textContent='View';cl.setAttribute('aria-hidden','true');D.body.appendChild(cl);
  var px=0,py=0,cx=0,cy=0,on=false,card=null,raf=0,ev=null;
  function loop(){raf=0;
    if(ev){var t=ev.composedPath(),c=null,wk=null,link=false;
      for(var i=0;i<t.length;i++){var n=t[i];if(!n.classList)continue;
        if(n.tagName==='A'||n.tagName==='BUTTON')link=true;
        if(!c&&n.classList.contains('m3-has')){c=n;}
        if(!wk&&n.classList.contains('card'))wk=n;}
      if(c&&c!==card){card=c}
      if(c){var r=c.getBoundingClientRect();c.style.setProperty('--mx',(ev.clientX-r.left)+'px');c.style.setProperty('--my',(ev.clientY-r.top)+'px')}
      var h=wk&&wk.getRootNode().host,want=!!(h&&h.id==='work'&&!link);
      if(want!==on){on=want;cl.classList.toggle('on',on)}
      px=ev.clientX;py=ev.clientY;ev=null}
    cx+=(px-cx)*.2;cy+=(py-cy)*.2;
    cl.style.transform='translate('+(cx+16).toFixed(1)+'px,'+(cy+16).toFixed(1)+'px)';
    if(on||Math.abs(px-cx)>.5||Math.abs(py-cy)>.5)raf=requestAnimationFrame(loop)}
  addEventListener('pointermove',function(e){ev=e;if(!raf)raf=requestAnimationFrame(loop)},{passive:true});
  D.addEventListener('pointerleave',function(){on=false;cl.classList.remove('on')});
}
if(D.readyState==='complete')setTimeout(init,120);else addEventListener('load',function(){setTimeout(init,120)});
})();
</script>
<script id="aw-nav-scroll-js">(function(){var nav=document.getElementById('site-nav');if(!nav)return;var H=document.documentElement,last=window.scrollY||0,hidden=false,tick=false;
function set(h){if(h===hidden)return;hidden=h;nav.classList.toggle('aw-hide',h)}
function upd(){tick=false;var y=Math.max(0,window.scrollY||0);if(H.classList.contains('aw-lock')||y<80){set(false);last=y;return}var d=y-last;if(Math.abs(d)<8)return;set(d>0);last=y}
addEventListener('scroll',function(){if(!tick){tick=true;requestAnimationFrame(upd)}},{passive:true});
nav.addEventListener('focusin',function(){set(false)});})();</script>
